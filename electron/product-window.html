<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Producto</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #030810;
      color: #e0f2fe;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      -webkit-app-region: drag;
    }
    .frame {
      width: 100%; height: 100%;
      border: 2px solid rgba(56, 189, 248, 0.35);
      display: flex;
      flex-direction: column;
    }
    .titlebar {
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid rgba(56, 189, 248, 0.15);
      background: rgba(14, 165, 233, 0.06);
    }
    .title {
      font-size: 12px;
      letter-spacing: 0.12em;
      color: rgba(125, 211, 252, 0.75);
      text-transform: uppercase;
    }
    .close {
      -webkit-app-region: no-drag;
      width: 28px; height: 24px;
      border: none;
      background: transparent;
      color: rgba(125, 211, 252, 0.5);
      cursor: pointer;
      font-size: 16px;
      border-radius: 4px;
    }
    .close:hover { background: rgba(239, 68, 68, 0.25); color: #fca5a5; }
    .body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .screen {
      width: 70%;
      height: 65%;
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      border-radius: 4px;
      background: rgba(8, 20, 40, 0.6);
    }
    .knob {
      position: absolute;
      right: 12%;
      width: 36px; height: 36px;
      border-radius: 50%;
      border: 2px solid rgba(56, 189, 248, 0.45);
      background: rgba(14, 165, 233, 0.08);
    }
    .footer {
      height: 18px;
      border-top: 1px solid rgba(56, 189, 248, 0.12);
      background: rgba(14, 165, 233, 0.04);
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="titlebar">
      <span class="title" id="productName">Producto</span>
      <button class="close" id="btnClose" title="Cerrar">×</button>
    </div>
    <div class="body">
      <div class="screen"></div>
      <div class="knob"></div>
    </div>
    <div class="footer"></div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const name = params.get('name') || 'Producto';
    document.getElementById('productName').textContent = name;
    document.title = name;
    document.getElementById('btnClose').onclick = () => {
      if (window.elyraProduct) window.elyraProduct.close();
      else window.close();
    };
  </script>
</body>
</html>
